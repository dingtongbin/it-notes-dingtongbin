# 每次推送到 main 时：自动构建 vitepress 站点并部署到 GitHub Pages
name: Deploy vitepress site to Pages

on:
  # 推送/PR 合并到 main 时触发
  push:
    branches: [main]
  # 也可以在 GitHub 页面手动触发
  workflow_dispatch:

# 授权：允许写入 Pages 与校验 token
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新推送会取消在跑中的任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # 第一步：构建
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建站点
        run: npm run docs:build

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # 第二步：部署（依赖 build 成功）
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 部署到 github-pages 环境（可在仓库 Settings 里看到部署记录）
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4